[project]
name = "data-retention-auditor"
version = "1.0.0"
description = "Scans data schemas for missing retention periods under UK GDPR Article 5(1)(e)"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "gdpr",
    "data-retention",
    "article-5",
    "compliance",
    "python",
    "data-protection",
    "information-governance",
    "uk-gdpr",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
