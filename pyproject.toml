[project]
name = "data-retention-auditor"
version = "0.1.0"
description = "Scans data schemas for missing retention periods under UK GDPR Article 5(1)(e)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
